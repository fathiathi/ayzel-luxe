<!DOCTYPE html>
<html lang="en">
<head>

    <div class="login-container">

        <div class="login-box">

            <h1>AYZEL LUXE</h1>

            <p class="signup-text">
                Don't have an account?

            </p>

            <a href="index.html" class="back-home">← Back to Home</a>

    </div>
<script src="script.js"></script>
</body>
